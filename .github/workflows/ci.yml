name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --prefix app install --frozen-lockfile

      - name: Run Biome Check
        run: pnpm --prefix app lint

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --prefix app install --frozen-lockfile

      - name: Provision mock credentials and config
        run: |
          if [ ! -f app/service-account.json ]; then
            cp app/service-account.example.json app/service-account.json
          fi
          if [ ! -f app/config.json ]; then
            cp app/config.example.json app/config.json
          fi

      - name: Build TypeScript project
        run: pnpm --prefix app build

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --prefix app install --frozen-lockfile

      - name: Provision mock credentials and config
        run: |
          if [ ! -f app/service-account.json ]; then
            cp app/service-account.example.json app/service-account.json
          fi
          if [ ! -f app/config.json ]; then
            cp app/config.example.json app/config.json
          fi

      # Baseline: the PR's base commit on pull_request, the previous commit on push.
      - name: Download baseline coverage
        id: base-coverage
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          find_run() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BASE_BRANCH" \
              --event push "$@" --limit 1 --json databaseId --jq '.[0].databaseId // empty'
          }
          download() {
            [ -n "$1" ] && gh run download "$1" --repo "$GITHUB_REPOSITORY" --name coverage-report --dir app/coverage-base
          }
          if download "$(find_run --commit "$BASE_SHA")"; then
            echo "Comparing against $BASE_BRANCH@$BASE_SHA."
          elif download "$(find_run --status success)"; then
            echo "::warning::No coverage for $BASE_BRANCH@$BASE_SHA; comparing against the latest successful $BASE_BRANCH run instead."
          else
            echo "No $BASE_BRANCH coverage found; skipping comparison."
            exit 0
          fi
          if [ -f app/coverage-base/coverage-summary.json ]; then
            echo "summary-path=coverage-base/coverage-summary.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests with coverage
        run: pnpm --prefix app test:coverage

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          working-directory: app
          json-summary-compare-path: ${{ steps.base-coverage.outputs.summary-path }}
          file-coverage-mode: changes
          comment-on: ${{ github.event.pull_request.head.repo.fork && 'none' || 'pr' }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/
          if-no-files-found: warn
